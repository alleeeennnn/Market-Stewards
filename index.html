<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B4332" />
    <title>Market Stewards</title>
    <meta
      name="description"
      content="Market Stewards teaches trading with integrity, stewardship, and discipline. Structured education, a community that reviews your work honestly, and live market study."
    />
    <meta name="color-scheme" content="light" />

    <!-- Structured data: organisation identity, not a product claim. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Market Stewards",
        "slogan": "Discipline. Purpose. Impact.",
        "description": "A Filipino trading community focused on structured trading education, financial wisdom, stewardship, and personal development.",
        "areaServed": "PH",
        "email": "hello@marketstewards.ph"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Cormorant Garamond carries the luxury display voice (hero, numerals,
      section titles). Inter carries body. Bank Gothic remains as a local-only
      fallback for the wordmark where installed.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Market Stewards is a JavaScript application. Please enable JavaScript, or reach us at
      hello@marketstewards.ph.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
